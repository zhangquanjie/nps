name: Publish binaries

on:
  push:
    tags:
      - 'v*-fork.*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }} packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [windows, linux, darwin, freebsd]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
      - run: bash scripts/package-binaries.sh "${{ matrix.os }}" dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: packages-${{ matrix.os }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Publish verified build output
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum -- *.tar.gz > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$state" != true ]]; then
              echo "Release $RELEASE_TAG is already published."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "NPS $RELEASE_TAG" --notes-file - <<'NOTES'
          NPS 二次开发版，基于 [ehang-io/nps](https://github.com/ehang-io/nps)，按 GNU GPL v3 分发。

          支持 TCP 连续端口分组、逐端口流量、最近访问 IP 和管理端主题。

          按操作系统和架构下载对应包。文件名中的 `server` 是服务端 NPS，`client` 是客户端 NPC。服务端包包含 Web 管理界面与示例配置。可用 `SHA256SUMS.txt` 校验下载。
          NOTES
          fi
          gh release upload "$RELEASE_TAG" --clobber -- *.tar.gz SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false --latest
